{% extends "base.html" %}{% block content %}<section class="auth card"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>Reset password</h1><p class="muted">Enter your registered email, reset PIN and new password.</p><form method="post"><label>Email address</label><input type="email" name="email" required><label>Reset PIN</label><input type="password" name="pin" required><label>New password</label><input type="password" name="new_password" minlength="8" required><label>Confirm new password</label><input type="password" name="confirm_password" minlength="8" required><button class="btn full">Reset Password</button></form><p class="links"><a href="{{url_for('login')}}">Back to Login</a></p></section>{% endblock %}
